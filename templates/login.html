<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Learning Tutor</title>
<style>
body { background:#121212; color:white; font-family:Poppins; display:flex; justify-content:center; align-items:center; height:100vh;}
form { background:#1e1e1e; padding:30px; border-radius:10px; display:flex; flex-direction:column; width:320px;}
input { padding:12px; margin:8px 0; border:none; border-radius:6px; background:#2b2b2b; color:white;}
button { background:#0078ff; border:none; padding:12px; color:white; border-radius:6px; cursor:pointer;}
button:hover { opacity:0.9; }
a { color:#4fc3f7; text-decoration:none; font-size:14px; margin-top:10px; text-align:center;}
.error { color:#f44336; font-size:14px; text-align:center;}
</style>
</head>
<body>
<form method="POST">
  <h2>🔐 Login</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <input type="text" name="username" placeholder="Username" required>
  <input type="password" name="password" placeholder="Password" required>
  <button type="submit">Login</button>
  <a href="/register">Create an account</a>
</form>
</body>
</html>
