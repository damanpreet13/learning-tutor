<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Habit Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { background:#0f172a; color:white; font-family:Arial; }
.sidebar { width:220px; position:fixed; height:100vh; background:#1e293b; padding:20px; border-right:1px solid #334155; }
.sidebar h3 { color:#60a5fa; margin-bottom:20px; }
.sidebar a { display:block; color:white; margin-bottom:10px; padding:8px; border-radius:6px; text-decoration:none; }
.sidebar a:hover { background:#334155; }
.main { margin-left:240px; padding:20px; }
.card { background:#1e293b; border:1px solid #334155; border-radius:12px; color:white; margin-bottom:15px; padding:15px; }
.habit-item { display:flex; justify-content:space-between; align-items:center; background:#334155; padding:10px; border-radius:8px; margin-bottom:8px; }
.btn-complete { background:#22c55e; border:none; color:white; }
.btn-delete { background:#ef4444; border:none; color:white; }
input, select, textarea { background:#334155 !important; border:none !important; color:white !important; }
::placeholder { color:#94a3b8; }
.form-check-input:checked { background-color:#22c55e; border-color:#22c55e; }
</style>
</head>
<body>

<div class="sidebar">
  <h3>Welcome, {{ username }}</h3>
  <a href="#">Dashboard</a>
  <a href="#">Habits</a>
  <a href="#">Calendar</a>
  <a href="#">Analytics</a>
  <a href="/logout" style="color:#ef4444;">Logout</a>
</div>

<div class="main">
  <h2>Dashboard</h2>
  <div class="row mb-4">
    <div class="col-md-3 card"><h6>Total Habits</h6><h2 id="totalHabits">0</h2></div>
    <div class="col-md-3 card"><h6>Completed Today</h6><h2 id="completedHabits">0</h2></div>
    <div class="col-md-3 card"><h6>Total Streak</h6><h2 id="streak">0</h2></div>
    <div class="col-md-3 card"><h6>Success Rate</h6><h2 id="successRate">0%</h2></div>
  </div>

  <div class="card">
    <button class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#habitModal">➕ Create Habit</button>
  </div>

  <div class="card">
    <h5>Your Habits</h5>
    <div id="habitList"></div>
  </div>

  <div class="card">
    <h5>Weekly Progress</h5>
    <canvas id="habitChart"></canvas>
  </div>
</div>

<!-- Habit Modal -->
<div class="modal fade" id="habitModal">
  <div class="modal-dialog">
    <div class="modal-content" style="background:#1e293b; color:white; border-radius:12px;">
      <div class="modal-header border-0">
        <h5>Create Habit</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <form action="/add_habit" method="POST">
        <div class="modal-body">
          <div class="mb-3"><label>Habit Name</label>
            <input type="text" name="name" class="form-control" placeholder="Morning Exercise" required></div>
          <div class="mb-3"><label>Question</label>
            <input type="text" name="question" class="form-control" placeholder="Did you exercise today?" required></div>
          <div class="mb-3"><label>Color</label>
            <input type="color" name="color" class="form-control form-control-color" required></div>
          <div class="mb-3"><label>Frequency</label>
            <select name="frequency" class="form-control" required><option>Daily</option><option>Weekly</option></select></div>

          <div class="mb-3"><label>Enable Reminder</label>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="reminderToggle" name="reminderToggle" onchange="toggleReminder()"></div></div>

          <div class="mb-3"><label>Reminder Time</label>
            <div style="display:flex; gap:10px;">
              <input type="time" name="habitTime" id="habitTime" class="form-control" disabled>
              <select name="habitAmPm" id="habitAmPm" class="form-control" disabled>
                <option>AM</option><option>PM</option>
              </select></div></div>

          <div class="mb-3"><label>Notes</label>
            <textarea name="notes" class="form-control" placeholder="30 min jogging or gym"></textarea></div>
        </div>

        <div class="modal-footer border-0">
          <button type="submit" class="btn btn-success w-100">Save Habit</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function toggleReminder(){
    const toggle = document.getElementById("reminderToggle");
    const timeInput = document.getElementById("habitTime");
    const ampmSelect = document.getElementById("habitAmPm");
    if(toggle.checked){
        timeInput.disabled = false;
        ampmSelect.disabled = false;
        toggle.style.backgroundColor = "#22c55e";
    } else {
        timeInput.disabled = true;
        ampmSelect.disabled = true;
        timeInput.value = "";
        toggle.style.backgroundColor = "#ef4444";
    }
}

// Fetch habits and update dashboard
async function loadHabits(){
    let res = await fetch("/get_habits");
    let data = await res.json();
    let container = document.getElementById("habitList");
    container.innerHTML = "";
    let completedToday = 0;
    data.forEach(h => {
        let today = new Date().toISOString().split("T")[0];
        let doneToday = h.completed_dates.includes(today);
        if(doneToday) completedToday++;

        let div = document.createElement("div");
        div.className="habit-item";
        div.innerHTML = `<span>${h.habit_name} (🔥 ${h.streak})</span>
        <div>
        <button class="btn btn-sm btn-complete" onclick="completeHabit('${h._id}')" ${doneToday?"disabled":""}>
        ${doneToday?"✔ Done":"Complete"}</button>
        <button class="btn btn-sm btn-delete" onclick="deleteHabit('${h._id}')">✖</button>
        </div>`;
        container.appendChild(div);
    });
    updateStats(data, completedToday);
    updateChart(data);
}

async function completeHabit(id){
    await fetch("/complete_habit/"+id, {method:"POST"});
    loadHabits();
}

async function deleteHabit(id){
    await fetch("/delete_habit/"+id, {method:"DELETE"});
    loadHabits();
}

function updateStats(data, completedToday){
    document.getElementById("totalHabits").innerText = data.length;
    document.getElementById("completedHabits").innerText = completedToday;
    let totalStreak = data.reduce((a,b)=>a+b.streak,0);
    document.getElementById("streak").innerText = totalStreak;
    let success = data.length==0?0:Math.round((completedToday/data.length)*100);
    document.getElementById("successRate").innerText = success+"%";
}

// Chart
let ctx = document.getElementById("habitChart");
let chart = new Chart(ctx, {type:'bar', data:{labels:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"], datasets:[{label:"Completed Habits", data:[0,0,0,0,0,0,0], backgroundColor:"#60a5fa"}]}});

function updateChart(data){
    let weekDays = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    let counts = [0,0,0,0,0,0,0];
    let today = new Date();
    for(let i=0;i<7;i++){
        let day = new Date(today.getFullYear(), today.getMonth(), today.getDate()-i);
        let dayStr = day.toISOString().split("T")[0];
        let index = day.getDay()-1; if(index<0) index=6;
        counts[index] = data.filter(h=>h.completed_dates.includes(dayStr)).length;
    }
    chart.data.datasets[0].data = counts;
    chart.update();
}

loadHabits();
</script>
</body>
</html>
