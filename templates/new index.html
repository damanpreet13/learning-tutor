<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Habit Tracker</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
}

.sidebar{
height:100vh;
background:#1e293b;
padding:20px;
position:fixed;
width:220px;
}

.sidebar h3{
color:#60a5fa;
margin-bottom:30px;
}

.sidebar a{
display:block;
color:white;
padding:10px;
text-decoration:none;
margin-bottom:10px;
border-radius:8px;
}

.sidebar a:hover{
background:#334155;
}

.main{
margin-left:240px;
padding:30px;
}

.card{
background:#1e293b;
border:none;
border-radius:15px;
color:white;
}

.habit-item{
background:#334155;
padding:12px;
border-radius:10px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.btn-complete{
background:#22c55e;
border:none;
}

.btn-delete{
background:#ef4444;
border:none;
}

input{
background:#334155 !important;
border:none !important;
color:white !important;
}

</style>
</head>

<body>

<div class="sidebar">

<h3>Habit Tracker</h3>

<a href="#">Dashboard</a>
<a href="#">Habits</a>
<a href="#">Calendar</a>
<a href="#">Analytics</a>
<a href="#">AI Assistant</a>
<a href="#">Logout</a>

</div>


<div class="main">

<h2 class="mb-4">Dashboard</h2>

<div class="row mb-4">

<div class="col-md-3">
<div class="card p-3">
<h5>Total Habits</h5>
<h2 id="totalHabits">0</h2>
</div>
</div>

<div class="col-md-3">
<div class="card p-3">
<h5>Completed Today</h5>
<h2 id="completedHabits">0</h2>
</div>
</div>

<div class="col-md-3">
<div class="card p-3">
<h5>Total Streak</h5>
<h2 id="streak">0</h2>
</div>
</div>

<div class="col-md-3">
<div class="card p-3">
<h5>Success Rate</h5>
<h2 id="successRate">0%</h2>
</div>
</div>

</div>


<div class="card p-3 mb-4">

<h5>Add New Habit</h5>

<div class="input-group">

<input type="text" id="habitInput" class="form-control" placeholder="Enter habit">

<button class="btn btn-primary" onclick="addHabit()">Add</button>

</div>

</div>


<div class="card p-3 mb-4">

<h5>Your Habits</h5>

<div id="habitList"></div>

</div>


<div class="card p-3">

<h5>Weekly Progress</h5>

<canvas id="habitChart"></canvas>

</div>

</div>


<script>

let habits=[]

function getToday(){
let today=new Date()
return today.toISOString().split("T")[0]
}

function addHabit(){

let habit=document.getElementById("habitInput").value

if(habit=="") return

habits.push({
name:habit,
completed_dates:[],
streak:0
})

document.getElementById("habitInput").value=""

renderHabits()

}

function renderHabits(){

let container=document.getElementById("habitList")

container.innerHTML=""

let today=getToday()

habits.forEach((h,index)=>{

let completedToday=h.completed_dates.includes(today)

let div=document.createElement("div")

div.className="habit-item"

div.innerHTML=`

<span>${h.name} (🔥 Streak: ${h.streak})</span>

<div>

<button class="btn btn-sm btn-complete"
onclick="completeHabit(${index})"
${completedToday ? "disabled" : ""}>

${completedToday ? "✔ Done" : "Complete"}

</button>

<button class="btn btn-sm btn-delete"
onclick="deleteHabit(${index})">✖</button>

</div>

`

container.appendChild(div)

})

updateStats()

}

function completeHabit(index){

let today=getToday()

let habit=habits[index]

if(!habit.completed_dates.includes(today)){

habit.completed_dates.push(today)

calculateStreak(habit)

}

renderHabits()

}

function calculateStreak(habit){

let dates=habit.completed_dates.sort()

let streak=0

let today=new Date()

for(let i=dates.length-1;i>=0;i--){

let date=new Date(dates[i])

let diff=(today-date)/(1000*60*60*24)

if(Math.floor(diff)==streak){
streak++
}

}

habit.streak=streak

}

function deleteHabit(index){

habits.splice(index,1)

renderHabits()

}

function updateStats(){

document.getElementById("totalHabits").innerText=habits.length

let today=getToday()

let completed=habits.filter(h=>h.completed_dates.includes(today)).length

document.getElementById("completedHabits").innerText=completed

let totalStreak=habits.reduce((sum,h)=>sum+h.streak,0)

document.getElementById("streak").innerText=totalStreak

let successRate=habits.length==0?0:Math.round((completed/habits.length)*100)

document.getElementById("successRate").innerText=successRate+"%"

}


let ctx=document.getElementById("habitChart")

new Chart(ctx,{
type:"bar",
data:{
labels:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
datasets:[{
label:"Completed Habits",
data:[0,0,0,0,0,0,0]
}]
}
})

</script>

</body>
</html>
