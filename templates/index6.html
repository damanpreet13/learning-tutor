<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 Personal Learning Tutor</title>
<style>
body { margin:0; font-family:Poppins; background:#121212; color:white; }
#app-container { display:flex; height:95vh; width:95vw; margin:auto; }
#sidebar { width:25%; background:#1a1a1a; border-radius:15px; padding:10px; display:flex; flex-direction:column; }
#new-chat-btn { background:#4fc3f7; color:white; border:none; padding:8px 15px; border-radius:10px; cursor:pointer; margin-bottom:10px; font-size:14px; transition:0.3s; }
#new-chat-btn:hover { background:#3aa0d3; }
#history-list { list-style:none; padding:0; overflow-y:auto; flex:1; }
.history-item { display:flex; justify-content:space-between; align-items:center; padding:8px; margin:4px 0; background:#333; border-radius:10px; cursor:pointer; }
.history-item:hover { background:#444; }
.delete-btn { background:none; border:none; color:#ff4d4d; font-size:16px; cursor:pointer; }
.chat-container { width:75%; background:#1e1e1e; border-radius:15px; padding:20px; display:flex; flex-direction:column; position:relative; }
#chat-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; }
h2 { color:#4fc3f7; margin:0; }
#user-avatar-container { position:relative; }
#user-avatar { width:40px; height:40px; background:#4fc3f7; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold; cursor:pointer; text-transform:uppercase; }
#user-details { display:none; position:absolute; top:50px; right:0; background:#1a1a1a; padding:10px; border-radius:8px; width:150px; box-shadow:0 2px 8px rgba(0,0,0,0.3); text-align:center; color:white; z-index:10; }
.chat-box { background:#2b2b2b; flex:1; overflow-y:auto; padding:15px; border-radius:10px; display:flex; flex-direction:column; }
.msg { margin:8px 0; padding:12px 16px; border-radius:15px; max-width:75%; word-wrap:break-word; line-height:1.4; }
.user { background:#0078ff; align-self:flex-end; color:white; }
.bot { background:#333; align-self:flex-start; color:white; }
.input-area { display:flex; margin-top:10px; align-items:center; }
input { flex:1; padding:12px; border-radius:10px; border:none; outline:none; background:#222; color:white; font-size:16px; }
button { padding:10px 15px; margin-left:5px; border-radius:10px; border:none; cursor:pointer; font-size:16px; transition:0.3s; }
#send-btn { background:#0078ff; color:white; }
#mic-btn { background:#28a745; color:white; }
#stop-speech-btn { background:#ff5722; color:white; }
#export-btn { background:#ff9800; color:white; }
#mode-select { margin-left:5px; border-radius:10px; background:#333; color:white; padding:10px; border:none; }
#logout-btn { background:#ff4d4d; border:none; padding:5px 10px; border-radius:5px; color:white; cursor:pointer; margin-top:5px; }
pre { white-space: pre-wrap; word-wrap: break-word; padding:10px; background:#222; border-radius:10px; color:#0f0; }
</style>
</head>
<body>
<div id="app-container">

  <!-- Sidebar -->
  <div id="sidebar">
    <button id="new-chat-btn">🆕 New Chat</button>
    <ul id="history-list"></ul>
  </div>

  <!-- Chat area -->
  <div class="chat-container">
    <!-- Header with title and user avatar -->
    <div id="chat-header">
      <h2>🎓 Personal Learning Tutor</h2>
      <div id="user-avatar-container">
        <div id="user-avatar">{{ username[0] }}</div>
        <div id="user-details">
          <p><strong>Username:</strong> {{ username }}</p>
          <button id="popup-logout-btn" onclick="logout()">Logout</button>
        </div>
      </div>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="msg bot">👋 Hi! I’m your personal learning tutor. Ask anything, I’ll explain clearly. 📚✨</div>
    </div>
    <div class="input-area">
      <button id="mic-btn">🎙️</button>
      <button id="stop-speech-btn">🔇 Stop Speech</button>
      <input type="text" id="user-input" placeholder="Type or speak your question..."/>
      <select id="mode-select">
        <option value="normal">Normal</option>
        <option value="step">Step-by-Step</option>
        <option value="quiz">Quiz</option>
      </select>
      <button id="send-btn">Send</button>
      <button id="export-btn">Export</button>
    </div>
  </div>
</div>

<script>
const sendBtn = document.getElementById("send-btn");
const userInput = document.getElementById("user-input");
const chatBox = document.getElementById("chatBox");
const micBtn = document.getElementById("mic-btn");
const stopSpeechBtn = document.getElementById("stop-speech-btn");
const modeSelect = document.getElementById("mode-select");
const historyList = document.getElementById("history-list");
const newChatBtn = document.getElementById("new-chat-btn");

// User avatar popup
const userAvatar = document.getElementById("user-avatar");
const userDetails = document.getElementById("user-details");
userAvatar.addEventListener("click", () => {
    userDetails.style.display = (userDetails.style.display === "block") ? "none" : "block";
});
document.addEventListener("click", (event) => {
    if (!userAvatar.contains(event.target) && !userDetails.contains(event.target)) {
        userDetails.style.display = "none";
    }
});

// SpeechSynthesis
let synth = window.speechSynthesis;
let currentUtterance = null;

// Append messages
function appendMessage(sender, message){
    const div = document.createElement("div");
    div.classList.add("msg", sender);
    const codeBlockMatch = message.match(/```([\s\S]*?)```/);
    if(codeBlockMatch){
        div.innerHTML = `<pre>${codeBlockMatch[1]}</pre>`;
    } else {
        let cleanText = message.replace(/[#*_]/g, "");
        cleanText = cleanText.replace(/\n/g, "<br>");
        div.innerHTML = cleanText;
    }
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

// Speak text
function speakText(text){
    if(synth.speaking) synth.cancel();
    currentUtterance = new SpeechSynthesisUtterance(text);
    currentUtterance.lang = "en-IN";
    currentUtterance.rate = 1;
    synth.speak(currentUtterance);
}

// Stop speech
function stopSpeech(){
    if(synth.speaking) synth.cancel();
}

// Send message
async function sendMessage(message){
    const mode = modeSelect.value;
    appendMessage("user", message);
    userInput.value="";

    const botPlaceholder = document.createElement("div");
    botPlaceholder.classList.add("msg","bot");
    botPlaceholder.textContent="🤖 Thinking...";
    chatBox.appendChild(botPlaceholder);
    chatBox.scrollTop = chatBox.scrollHeight;

    try{
        const res = await fetch("/chat",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({message, mode})
        });
        const data = await res.json();
        botPlaceholder.textContent = data.reply;
        loadHistory();
        speakText(data.reply);
    } catch{
        botPlaceholder.textContent = "⚠️ Error connecting to AI.";
    }
}

// Load history
async function loadHistory(){
    try{
        const res = await fetch("/history");
        const data = await res.json();
        historyList.innerHTML = "";
        data.forEach(chat => {
            const li = document.createElement("li");
            li.classList.add("history-item");
            li.innerHTML = `<span onclick="showChatById('${chat._id}')">${chat.user}</span>
                            <button class="delete-btn" onclick="deleteChat('${chat._id}', event)">🗑️</button>`;
            historyList.appendChild(li);
        });
    }catch{ console.log("⚠️ Could not load history."); }
}

// Show chat by ID
function showChatById(chatId){
    fetch("/history")
    .then(res => res.json())
    .then(data => {
        const chat = data.find(c => c._id === chatId);
        if(chat) showChat(chat);
    });
}

// Show selected chat
function showChat(chat){
    chatBox.innerHTML = "";
    appendMessage("user", chat.user);
    appendMessage(chat.type==="code"?"bot":"bot", chat.bot);
}

// Delete chat
function deleteChat(chatId, event){
    event.stopPropagation();
    if(confirm("Are you sure you want to delete this chat?")){
        fetch(`/delete/${chatId}`, { method: "DELETE" })
        .then(res => res.json())
        .then(data => { if(data.success) loadHistory(); else alert(data.message); });
    }
}

// New Chat
newChatBtn.addEventListener("click", ()=> {
    chatBox.innerHTML = "";
    appendMessage("bot","👋 Hi! I’m your personal learning tutor. Ask anything, I’ll explain clearly. 📚✨");
    userInput.value="";
    modeSelect.value="normal";
    stopSpeech();
});

// Logout
function logout(){
    stopSpeech();
    fetch("/logout").then(()=> window.location.href="/login").catch(()=> alert("⚠️ Error logging out."));
}

// Event listeners
sendBtn.addEventListener("click",()=>{ const msg=userInput.value.trim(); if(msg) sendMessage(msg); });
userInput.addEventListener("keypress",e=>{ if(e.key==="Enter") sendBtn.click(); });
stopSpeechBtn.addEventListener("click", stopSpeech);

// Voice recognition
if("webkitSpeechRecognition" in window){
    const recognition = new webkitSpeechRecognition();
    recognition.lang="en-US"; recognition.continuous=false; recognition.interimResults=false;
    let recognizing = false;

    micBtn.addEventListener("click", ()=> {
        if(!recognizing){
            recognition.start();
            recognizing=true;
            micBtn.textContent="🎧"; micBtn.style.backgroundColor="#dc3545";
        } else {
            recognition.stop();
            recognizing=false;
            micBtn.textContent="🎙️"; micBtn.style.backgroundColor="#28a745";
        }
    });

    recognition.onresult = function(event){
        const speech = event.results[0][0].transcript;
        userInput.value = speech;
        sendMessage(speech);
        recognizing=false;
        micBtn.textContent="🎙️"; micBtn.style.backgroundColor="#28a745";
    };

    recognition.onerror = function(){
        recognizing=false;
        micBtn.textContent="🎙️"; micBtn.style.backgroundColor="#28a745";
        appendMessage("bot","⚠️ Voice recognition error.");
    };
}else{ micBtn.style.display="none"; }

loadHistory();
</script>
</body>
</html>
