<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Learning Tutor</title>
<style>
  body { background:#121212; color:white; font-family:Poppins; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;}
  .chat-container { background:#1e1e1e; border-radius:15px; width:90%; max-width:700px; padding:20px; display:flex; flex-direction:column;}
  h2 { text-align:center; color:#4fc3f7; margin-bottom:15px;}
  .chat-box { background:#2b2b2b; height:400px; overflow-y:auto; padding:15px; border-radius:10px; display:flex; flex-direction:column;}
  .msg { margin:8px 0; padding:12px 16px; border-radius:15px; max-width:75%; line-height:1.4; word-wrap:break-word;}
  .user { background:#0078ff; align-self:flex-end; margin-left:auto; color:white;}
  .bot { background:#333; margin-right:auto; color:white;}
  .input-area { display:flex; margin-top:10px; align-items:center;}
  input { flex:1; padding:12px; border-radius:10px; border:none; outline:none; background:#222; color:white; font-size:16px;}
  button { padding:10px 15px; margin-left:5px; border-radius:10px; border:none; cursor:pointer; font-size:16px; transition:0.3s;}
  button:hover { opacity:0.85;}
  #send-btn { background:#0078ff; color:white;}
  #mic-btn { background:#28a745; color:white;}
  #export-btn { background:#ff9800; color:white;}
  #mode-select { margin-left:5px; border-radius:10px; background:#333; color:white; padding:10px; border:none;}
</style>
</head>
<body>
<div class="chat-container">
  <h2>🎓 Personal Learning Tutor</h2>
  <div class="chat-box" id="chatBox">
    <div class="msg bot">👋 Hi! I’m your personal learning tutor. Ask anything, I’ll explain clearly. 📚✨</div>
  </div>
  <div class="input-area">
    <button id="mic-btn">🎙️</button>
    <input type="text" id="user-input" placeholder="Type or speak your question..."/>
    <select id="mode-select">
      <option value="normal">Normal</option>
      <option value="step">Step-by-Step</option>
      <option value="quiz">Quiz</option>
    </select>
    <button id="send-btn">Send</button>
    <button id="export-btn">Export</button>
  </div>
</div>

<script>
const sendBtn = document.getElementById("send-btn");
const userInput = document.getElementById("user-input");
const chatBox = document.getElementById("chatBox");
const micBtn = document.getElementById("mic-btn");
const exportBtn = document.getElementById("export-btn");
const modeSelect = document.getElementById("mode-select");

// Append messages
function appendMessage(sender, message){
  const div = document.createElement("div");
  div.classList.add("msg", sender);
  div.textContent = message;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

// Send message
async function sendMessage(message){
  const mode = modeSelect.value;
  appendMessage("user", message);
  userInput.value = "";

  const botPlaceholder = document.createElement("div");
  botPlaceholder.classList.add("msg","bot");
  botPlaceholder.textContent = "🤖 Thinking...";
  chatBox.appendChild(botPlaceholder);
  chatBox.scrollTop = chatBox.scrollHeight;

  try {
    const res = await fetch("/chat", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:message, mode:mode})
    });
    const data = await res.json();
    botPlaceholder.textContent = data.reply;

    // Voice output
    const utter = new SpeechSynthesisUtterance(data.reply);
    utter.lang = "en-IN"; utter.rate = 1;
    speechSynthesis.speak(utter);
  } catch {
    botPlaceholder.textContent = "⚠️ Error connecting to AI.";
  }
}

// Send button / enter key
sendBtn.addEventListener("click", ()=>{ const msg=userInput.value.trim(); if(msg) sendMessage(msg); });
userInput.addEventListener("keypress", e=>{ if(e.key==="Enter") sendBtn.click(); });

// Mic voice input
if("webkitSpeechRecognition" in window){
  const recognition = new webkitSpeechRecognition();
  recognition.lang="en-US"; recognition.continuous=false; recognition.interimResults=false;

  micBtn.addEventListener("click", ()=>{
    recognition.start();
    micBtn.textContent="🎧"; micBtn.style.backgroundColor="#dc3545";
  });

  recognition.onresult = function(event){
    const speech = event.results[0][0].transcript;
    userInput.value = speech;
    micBtn.textContent="🎙️"; micBtn.style.backgroundColor="#28a745";
    sendMessage(speech);
  };

  recognition.onerror = function(){
    micBtn.textContent="🎙️"; micBtn.style.backgroundColor="#28a745";
    appendMessage("bot","⚠️ Voice recognition error.");
  };
}else{
  micBtn.style.display="none";
  appendMessage("bot","⚠️ Voice input not supported in this browser.");
}

// Export chat
exportBtn.addEventListener("click", ()=>{ window.open("/export","_blank"); });
</script>
</body>
</html>
