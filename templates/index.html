<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎓 Personal Learning Tutor</title>
  <style>
    body {
      background-color: #111;
      color: white;
      font-family: "Poppins", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .chat-container {
      background-color: #1e1e1e;
      border-radius: 15px;
      width: 90%;
      max-width: 700px;
      padding: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }

    h2 {
      text-align: center;
      margin-bottom: 15px;
      color: #0078ff;
    }

    .chat-box {
      background-color: #2b2b2b;
      height: 400px;
      overflow-y: auto;
      padding: 10px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
    }

    .msg {
      margin: 8px 0;
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 75%;
      line-height: 1.4;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease-in;
    }

    .user {
      background-color: #0078ff;
      align-self: flex-end;
      margin-left: auto;
    }

    .bot {
      background-color: #333;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      margin-top: 15px;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: none;
      outline: none;
      background-color: #222;
      color: white;
      font-size: 16px;
    }

    button {
      background-color: #0078ff;
      color: white;
      border: none;
      padding: 10px 15px;
      margin-left: 5px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #005fcc;
    }

    #mic-btn {
      background-color: #28a745;
    }

    #mic-btn:hover {
      background-color: #1e7e34;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <h2>🎓 Personal Learning Tutor</h2>

    <!-- Chat messages -->
    <div class="chat-box" id="chatBox">
      <div class="msg bot">👋 Hi! I’m your personal learning tutor.
        You can ask me any topic — I’ll explain it clearly with examples. 📚✨
      </div>
    </div>

    <!-- Input area -->
    <div class="input-area">
      <button id="mic-btn">🎙️</button>
      <input type="text" id="user-input" placeholder="Type or speak your question..." />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script>
    const sendBtn = document.getElementById("send-btn");
    const userInput = document.getElementById("user-input");
    const chatBox = document.getElementById("chatBox");
    const micBtn = document.getElementById("mic-btn");

    // Append chat messages
    function appendMessage(sender, message) {
      const div = document.createElement("div");
      div.classList.add("msg", sender);
      div.textContent = message;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Send message to Flask backend
    async function sendMessage(message) {
      appendMessage("user", message);
      userInput.value = "";

      const botPlaceholder = document.createElement("div");
      botPlaceholder.classList.add("msg", "bot");
      botPlaceholder.textContent = "🤖 Thinking...";
      chatBox.appendChild(botPlaceholder);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        const data = await res.json();
        botPlaceholder.textContent = data.reply;

        // Speak AI response
        const utterance = new SpeechSynthesisUtterance(data.reply);
        utterance.lang = "en-IN";
        utterance.rate = 1;
        speechSynthesis.speak(utterance);
      } catch {
        botPlaceholder.textContent = "⚠️ Error connecting to AI.";
      }
    }

    // Send button click
    sendBtn.addEventListener("click", () => {
      const msg = userInput.value.trim();
      if (msg) sendMessage(msg);
    });

    // Press Enter to send
    userInput.addEventListener("keypress", e => {
      if (e.key === "Enter") sendBtn.click();
    });

    // Voice input logic
    if ("webkitSpeechRecognition" in window) {
      const recognition = new webkitSpeechRecognition();
      recognition.lang = "en-US";
      recognition.continuous = false;
      recognition.interimResults = false;

      micBtn.addEventListener("click", () => {
        recognition.start();
        micBtn.textContent = "🎧";
        micBtn.style.backgroundColor = "#dc3545";
      });

      recognition.onresult = function(event) {
        const speech = event.results[0][0].transcript;
        userInput.value = speech;
        micBtn.textContent = "🎙️";
        micBtn.style.backgroundColor = "#28a745";
        sendMessage(speech);
      };

      recognition.onerror = function() {
        micBtn.textContent = "🎙️";
        micBtn.style.backgroundColor = "#28a745";
        appendMessage("bot", "⚠️ Voice recognition error. Try again.");
      };
    } else {
      micBtn.style.display = "none";
      appendMessage("bot", "⚠️ Voice recognition not supported in this browser.");
    }
  </script>
</body>
</html>
